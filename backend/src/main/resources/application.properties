spring.application.name=backend

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# ===============================
# DATABASE CONNECTION (Hỗ trợ tiếng Việt UTF-8 đầy đủ)
# ===============================
spring.datasource.url=jdbc:mariadb://localhost:3306/ecommerce_fashion_db?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===============================
# HTTP UTF-8 ENCODING (Bắt buộc mã hóa UTF-8 cho Request & Response)
# ===============================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# ===============================
# JPA & HIBERNATE CONFIG
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# ===============================
# SERVER CONFIG
# ===============================
server.port=8080

# Phi van chuyen demo (VND)
checkout.shipping-fee=30000

# ===============================
# AI SERVICE (Fashion-CLIP Multimodal Search)
# ===============================
